# 定時更新鄉民指標並發布到 GitHub Pages
# 排程是 UTC 時間；分鐘避開整點（整點時 GitHub 排程最容易延遲或被跳過）
name: 更新鄉民指標

on:
  push:                            # 負責抓 PTT 的電腦推上新文章或畢業文判斷結果，或改了網頁／重算程式 → 重算並更新網站
    branches: [main]
    paths: ['data/ptt_latest.json', 'data/loss_labels.json', 'data/loss_labels_ref.json', 'dashboard/index.html', 'dashboard/card.js', 'scripts/build_site.py', 'scripts/build_dashboard_data.py']
  schedule:
    # PTT 會擋 GitHub 的主機（2026/11/26 實測 HTTP 403），所以雲端不排每 15 分鐘的 PTT 更新；PTT 要從可連線的電腦更新後推上來
    # GitHub 的排程在尖峰時段可能延遲或被跳過（2026/11/26 15:40 那次就沒跑），所以平日收盤後多排幾次備援。
    # 更新只補缺的資料，重複跑沒有影響；沒有新資料時不會 commit。
    - cron: '40 7 * * 1-5'         # 台灣 15:40（平日）：完整更新，指數、P/C、三大法人
    - cron: '40 8 * * 1-5'         # 台灣 16:40（平日）：備援
    - cron: '10 10 * * 1-5'        # 台灣 18:10（平日）：備援
    - cron: '10 14 * * *'          # 台灣 22:10：完整更新，融資、違約公告；週末早上也會補到美國 VIX
    - cron: '50 0 * * 2-6'         # 台灣 08:50（週二到週六）：開盤前最後補一次前一天晚上的資料
  workflow_dispatch:
    inputs:
      mode:
        description: '更新範圍'
        type: choice
        options: [all, ptt]
        default: all

permissions:
  contents: write     # 把更新後的資料存回 repo
  pages: write        # 發布 GitHub Pages
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    env:
      TZ: Asia/Taipei
      PTT_PAGES: '10'            # 每次往回抓幾頁 PTT 列表（每頁約 20 篇）
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 抓資料並重算
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "push" ]; then
            python3 -I scripts/build_dashboard_data.py data dashboard/data > /dev/null
          elif [ "$MODE" = "ptt" ]; then
            python3 -I scripts/update_data.py data dashboard/data --only ptt
          else
            python3 -I scripts/update_data.py data dashboard/data
          fi
          python3 -I scripts/build_site.py dashboard site

      # 連結預覽圖（og:image）：用 runner 內建的 Chrome 把 site/card.html 截成 1200×630 的 PNG。失敗也照常部署，只是沒有預覽圖
      - name: 產生連結預覽圖
        continue-on-error: true
        run: |
          OG=$(cat site/og/.target); rm -f site/og/.target
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=1200,630 --virtual-time-budget=20000 --screenshot="$PWD/site/$OG" "file://$PWD/site/card.html"
          test -s "site/$OG" && echo "預覽圖：$OG"

      - name: 存回資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -q -m "資料更新 $(date '+%Y-%m-%d %H:%M')"
            git push -q || { git pull -q --rebase && git push -q; }
          fi

      - uses: actions/configure-pages@v6

      # 檔名帶上「第幾次執行」：在 GitHub 上手動重跑時，才不會跟上一次的檔案同名而部署失敗
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
          retention-days: 1

      # GitHub 偶爾剛上傳完還查不到檔案（2026/11/26 實測：上傳完半秒就查，回報找不到），失敗就等 30 秒再試一次
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: 部署失敗，等 30 秒
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
